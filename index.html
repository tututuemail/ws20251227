<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简主义 | 卓越建筑设计事务所</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* 导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            position: absolute;
            width: 100%;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 3rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #777;
        }

        /* 英雄版块 (Hero Section) */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
            background-color: #f9f9f9;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 2.5rem;
            max-width: 500px;
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: #1a1a1a;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .cta-button:hover {
            background-color: #444;
        }

        /* 作品展示区 */
        .projects {
            padding: 8rem 5%;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 4rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .project-item {
            position: relative;
            overflow: hidden;
            background-color: #eee;
            aspect-ratio: 16/10;
        }

        .project-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: 0.6s;
        }

        .project-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .project-info {
            padding: 1.5rem 0;
        }

        .project-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .project-info p {
            font-size: 0.9rem;
            color: #888;
        }

        /* 页脚 */
        footer {
            padding: 4rem 5%;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
        }

        footer p {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.8rem; }
            .nav-links { display: none; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ARCHI.STUDIO</div>
        <ul class="nav-links">
            <li><a href="#">作品项目</a></li>
            <li><a href="#">关于我们</a></li>
            <li><a href="#">设计理念</a></li>
            <li><a href="#">联系我们</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>构建<br>时间的形状</h1>
            <p>我们致力于将结构、光影与功能融合，创造出具有永恒美感的现代建筑空间。</p>
            <a href="#work" class="cta-button">查看作品集</a>
        </div>
    </section>

    <section class="projects" id="work">
        <h2 class="section-title">精选作品</h2>
        <div class="grid">
            <div class="project-card">
                <div class="project-item">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80" alt="项目1">
                </div>
                <div class="project-info">
                    <h3>城市光影大厦</h3>
                    <p>上海 / 2024</p>
                </div>
            </div>
            
            <div class="project-card">
                <div class="project-item">
                    <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=800&q=80" alt="项目2">
                </div>
                <div class="project-info">
                    <h3>森林几何别墅</h3>
                    <p>杭州 / 2023</p>
                </div>
            </div>

            <div class="project-card">
                <div class="project-item">
                    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=80" alt="项目3">
                </div>
                <div class="project-info">
                    <h3>极简工业总部</h3>
                    <p>深圳 / 2024</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 ARCHI.STUDIO 建筑设计事务所. 保留所有权利.</p>
    </footer>

</body>
</html>
